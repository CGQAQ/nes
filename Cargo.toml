[workspace]
resolver = "3"
members = ["crates/nes-core", "crates/nes-cli", "crates/nes-app"]
default-members = ["crates/nes-core", "crates/nes-cli", "crates/nes-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
authors = ["Jason Leo"]
repository = "https://github.com/cgqaq/nes"

[workspace.dependencies]
nes-core = { path = "crates/nes-core" }

serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
lz4_flex = "0.14.0"
crc32fast = "1.5.3"
enum_dispatch = "0.3.13"
thiserror = "2.0.21"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
log = "0.4.34"

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
png = "0.18.1"
serde_json = "1.0.154"
env_logger = "0.11.11"

# x11/wayland give winit a windowing backend on Linux (no-ops elsewhere).
eframe = { version = "0.37.0", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "x11",
    "wayland",
    "clipboard",
] }
egui = "0.37.0"
cpal = "0.18.2"
gilrs = "0.11.2"
rfd = "0.17.2"
web-time = "1.1.0"
wasm-bindgen-futures = "0.4.79"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
too_many_arguments = "allow"
new_without_default = "allow"

# The emulator core is far too slow at opt-level 0 to be usable, so keep it
# optimized even in debug builds; everything else stays debuggable.
[profile.dev.package.nes-core]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1

[profile.test]
opt-level = 1
